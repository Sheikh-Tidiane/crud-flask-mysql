{% extends "base.html" %}

{% block title %}Ajouter un Étudiant{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h1 class="h2 mb-4">
            <i class="fas fa-user-plus me-2 text-primary"></i>Ajouter un Étudiant
        </h1>
    </div>
    <div class="col-auto">
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i>Retour à la liste
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('main.ajouter') }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nom" name="nom" required>
                </div>
                <div class="col-md-6">
                    <label for="prenom" class="form-label">Prénom <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="prenom" name="prenom" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-6">
                    <label for="note" class="form-label">Note (/20)</label>
                    <input type="number" class="form-control" id="note" name="note" min="0" max="20" step="0.5">
                    <div class="form-text">Laissez vide si non évalué</div>
                </div>
                
                <div class="col-12 mt-4 text-end">
                    <button type="reset" class="btn btn-secondary me-2">
                        <i class="fas fa-undo me-1"></i>Réinitialiser
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Enregistrer
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
